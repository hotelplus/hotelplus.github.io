<html lang="tr">
<head>

<meta name="theme-color" content="#08163d">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Düzen: telefon genişliğinde tek sütun, durum çubuğuna göre boşluk bırakan üst bar, alt kısımda + düğmesi */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#141a2e; --muted:#646b80; --line:#dfe2ec;
  --accent:#16328a; --accent-ink:#ffffff; --accent-soft:#e3e9fa; --grad:linear-gradient(120deg,#08163d 0%,#13307f 60%,#1d48b8 100%);
  --gold:linear-gradient(120deg,#f6d77a 0%,#d9a426 55%,#b8800f 100%); --gold-ink:#2a1d00;
  --ok:#1e9e55; --warn:#d99100; --bad:#d63031; --info:#3867d6;
  --ok-soft:#e2f6ea; --warn-soft:#fff3d6; --bad-soft:#fde4e4; --info-soft:#e6edfb;
  --display:"Sora",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; color-scheme:light;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121118; --surface:#1c1b24; --ink:#ecebf2; --muted:#a19eae; --line:#2e2c39;
  --accent:#8fb0ff; --accent-ink:#08163d; --accent-soft:#1c2850;
  --ok:#4cd087; --warn:#f2b636; --bad:#ff6b6b; --info:#7aa2ff;
  --ok-soft:#163222; --warn-soft:#382b10; --bad-soft:#3d1a1a; --info-soft:#1a2440; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121118; --surface:#1c1b24; --ink:#ecebf2; --muted:#a19eae; --line:#2e2c39;
  --accent:#8fb0ff; --accent-ink:#08163d; --accent-soft:#1c2850;
  --ok:#4cd087; --warn:#f2b636; --bad:#ff6b6b; --info:#7aa2ff;
  --ok-soft:#163222; --warn-soft:#382b10; --bad-soft:#3d1a1a; --info-soft:#1a2440; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(90px + var(--safe-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--grad);color:#fff;border-bottom:2px solid #d9a426;padding:calc(8px + var(--safe-top)) 12px 8px;display:flex;align-items:center;gap:8px;min-height:52px}
header.top h1{font:600 15px/1.2 var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:rgba(255,255,255,.18);border:0;border-radius:10px;color:#fff;min-width:40px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:600;font-size:13px;position:relative;flex:none}
.hbtn svg{width:20px;height:20px}
.hbtn .badge{top:-4px;right:-4px}
.mark{width:30px;height:30px;border-radius:9px;background:#08163d;border:1px solid #d9a426;display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
main{padding:12px;display:flex;flex-direction:column;gap:12px}
.banner{font-size:13px;padding:9px 11px;border-radius:10px;background:var(--warn-soft);border:1px solid var(--line)}
h2{font:600 13px/1.2 var(--display);margin:4px 0 0;color:var(--muted)}
.hello{display:flex;align-items:center;gap:10px}
.hello b{font:600 16px var(--display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left;background:var(--surface)}
.stat .n{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.2}
.stat.g{border-color:var(--ok);background:var(--ok-soft)} .stat.g .n{color:var(--ok)}
.stat.y{border-color:var(--warn);background:var(--warn-soft)} .stat.y .n{color:var(--warn)}
.stat.r{border-color:var(--bad);background:var(--bad-soft)} .stat.r .n{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;position:relative;min-height:74px}
.tile .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.tile .ic svg{width:18px;height:18px}
.tile span.t{font-weight:600;font-size:12px;line-height:1.15}
.badge{position:absolute;top:6px;right:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;font-weight:700;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.task{border-left:5px solid var(--ok);gap:6px}
.task.lv-warn{border-left-color:var(--warn)} .task.lv-bad{border-left-color:var(--bad)} .task.lv-done{border-left-color:var(--line);opacity:.85}
.task .t1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.task .ttl{font-weight:700;font-size:14.5px}
.task .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.task .meta b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.late{color:var(--bad);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 13px;font-weight:600;cursor:pointer;min-height:38px}
.btn svg{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
a.btn{color:var(--ink);text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.go{background:var(--gold);border:0;color:var(--gold-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:13px;min-height:34px}
.btn.block{width:100%;padding:12px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap;position:relative}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .cnt{margin-left:4px;opacity:.7}
form.f{display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-height:42px}
.fld textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-weight:600;cursor:pointer;min-height:38px;white-space:nowrap}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.card.li{flex-direction:row}
.li .main{min-width:0;flex:1}
.li .main b{display:block}
.li .main span{font-size:12.5px;color:var(--muted);display:block}
.empty{color:var(--muted);text-align:center;padding:20px 8px;font-size:13.5px}
.chat{display:flex;flex-direction:column;gap:6px}
.bubble{max-width:82%;padding:7px 11px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bubble small{display:block;font-size:10.5px;opacity:.75;font-weight:600}
.composer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + var(--safe-bottom))}
.composer .in{max-width:536px;margin:0 auto;display:flex;gap:8px}
.composer input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 14px}
.fab{position:fixed;bottom:calc(18px + var(--safe-bottom));right:18px;height:52px;border-radius:26px;border:0;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:15px;padding:0 18px 0 14px;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 6px 18px rgba(185,128,15,.35);z-index:6}
.fab svg{width:22px;height:22px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.room{border:1px solid var(--line);border-radius:10px;padding:7px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;background:var(--surface);min-width:0}
.room b{font:700 14px var(--display)}
.room small{font-size:10.5px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-bos{background:var(--ok-soft);border-color:var(--ok)} .rs-bos small{color:var(--ok)}
.rs-dolu{background:var(--info-soft);border-color:var(--info)} .rs-dolu small{color:var(--info)}
.rs-kirli{background:var(--warn-soft);border-color:var(--warn)} .rs-kirli small{color:var(--warn)}
.rs-ariza{background:var(--bad-soft);border-color:var(--bad)} .rs-ariza small{color:var(--bad)}
.counts{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.counts b{display:block;font:700 17px var(--display);font-variant-numeric:tabular-nums}
.counts span{font-size:11.5px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:100px;border-bottom:1px solid var(--line)}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;opacity:.7;min-height:2px}
.bars div:last-child{opacity:1}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:30;max-width:90%;text-align:center}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:15}
.sheet .pnl{background:var(--bg);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 14px calc(20px + var(--safe-bottom));max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet h3{font:600 16px var(--display);margin:0;padding-right:40px}
.sheet .x{position:absolute;margin-left:auto}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.close{border:0;background:var(--surface);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;flex:none;border:1px solid var(--line)}
.muted{color:var(--muted)}
.selmode .room,.selmode [data-st]{opacity:.8}
.room.sel,[data-st].sel{outline:3px solid var(--bad);outline-offset:1px;opacity:1}
.bulkbar{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-bottom));box-shadow:0 -6px 18px rgba(0,0,0,.12)}
.bulkbar .in{max-width:536px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bulkbar b{flex:1}
.num{font-variant-numeric:tabular-nums}
.login{max-width:420px;margin:24px auto 0;width:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media (prefers-reduced-motion:no-preference){.tile,.btn,.stat{transition:transform .1s}.btn:active,.tile:active,.stat:active{transform:scale(.97)}}
</style>
</head>

<script>

   Ek süre = görev süresi kadar (en az 30 dk). Örnek: 45 dk iş → 45. dk sarı, 90. dk kırmızı. */

const deadline = t => (t.talep||0) + (t.dk||0)*60000;
const redAt = t => deadline(t) + Math.max(KIRMIZI_EK_MIN_DK, (t.dk||0)*KIRMIZI_EK_ORAN)*60000;
function level(t, now = Date.now()){
  if (t.durum === "done") return "done";
  if (now <= deadline(t)) return "ok";
  if (now <= redAt(t)) return "warn";
  return "bad";
}
const LV = {ok:["Zamanında","ok"], warn:["Müdüre düştü","warn"], bad:["Genel müdüre düştü","bad"], done:["Tamamlandı","mute"]};
function timeText(t){
  if (t.durum === "done"){ const late = mins((t.bitis||0) - deadline(t)); return late > 0 ? `<span class="late">${dur(late)} geç bitti</span>` : "Zamanında bitti"; }
  const now = Date.now(), dl = deadline(t);
  if (now <= dl) return `Kalan <b>${dur(mins(dl-now))}</b>`;
  return `<span class="late">${dur(mins(now-dl))} gecikti</span>`;
}
const visibleTasks = () => isGM() ? S.tasks : S.tasks.filter(t => t.dept === myDept() || t.atanan === meId || t.olusturan === meId);

/* ---------------- Bildirimler (uygulama içi) ---------------- */
function notifications(){
  const out = [];
  const md = myDept();
  for (const t of S.tasks){
    if (t.durum === "done") continue;
    const lv = level(t);
    if (t.atanan === meId) out.push({k:"t", t, lv, txt:"Sana atandı"});
    else if (!t.atanan && t.dept === md && t.olusturan !== meId) out.push({k:"t", t, lv, txt:"Departmanına yeni görev"});
    else if (lv === "warn" && managesDept(t.dept) && myRol() === "mudur") out.push({k:"t", t, lv, txt:"Süresi doldu, müdürüne düştü"});
    else if (lv === "bad" && (isGM() || managesDept(t.dept))) out.push({k:"t", t, lv, txt:"Kritik gecikme"});
  }
  if (isManager()) missedDv().filter(x => managesDept(x.t.dept)).forEach(x => out.push({k:"dv", dv:x, lv:"bad", txt:"Devriye yapılmadı"}));
  if (canStaffAdmin()){
    S.basvurular.filter(b => managesDept(b.dept)).forEach(b => out.push({k:"b", b, lv:"info", txt:"Üyelik başvurusu"}));
    S.sifreTalepleri.forEach(r => { const s = S.staff.find(x => x.tel === r.tel || x.kullanici === r.tel); if (!s || managesDept(s.dept)) out.push({k:"p", r, s, lv:"info", txt:"Şifre sıfırlama talebi"}); });
  }
  const rank = {bad:0, warn:1, info:2, ok:3};
  return out.sort((a,b) => rank[a.lv]-rank[b.lv]);
}

    if (MANAGER_ONLY.includes(c) && !mgrM()) return;
    if (c === "guestTel" && !(mgrM() || (member && member.dept === "Resepsiyon"))) return;
    if (c === "islemler" && !gmM()) return;
    let q = col(c);
    if (c === "chat") q = q.orderBy("zaman","desc").limit(200);
    if (c === "gmsgs") q = q.orderBy("zaman","desc").limit(300);
    if (c === "shifts") q = q.where("giris", ">=", Date.now() - 31*864e5);
    if (c === "guests") q = q.orderBy("olusturma","desc").limit(600);
    if (c === "islemler") q = q.orderBy("zaman","desc").limit(300);
    if (c === "yedekler") q = q.orderBy("zaman","desc").limit(60);
    if (c === "duyurular") q = q.orderBy("zaman","desc").limit(50);
    if (c === "members") q = q.where("otel", "==", OTEL);
    if (c === "devriyeKayit") q = q.where("tarih", ">=", dayKey(Date.now() - 7*864e5));
    if (c === "sikayetler" || c === "kayipesya") q = q.orderBy("zaman","desc").limit(300);
    unsubs.push(q.onSnapshot(snap => {
      const docs = snap.docs.map(d => ({id:d.id, ...d.data()}));
      if (c === "chat") onChatChanges(snap);
      if (c === "duyurular") onDuyuruChanges(snap);
      if (c === "staff" || c === "guests"){ raw[c] = docs; mergePriv(); }
      else if (c === "staffTel" || c === "guestTel"){ telMap[c] = Object.fromEntries(docs.map(d => [d.id, d.tel])); if (c === "staffTel") sifreMap = Object.fromEntries(docs.map(d => [d.id, d.sifre||""])); mergePriv(); }
      else S[c] = docs;
      if (mode === "loading" && c === "staff"){ mode = "live"; clearTimeout(timer); loadNote = ""; }
      refresh();
      if (c === "staff") { scheduleAlarms(); maybeMigrate(); }
      if (c === "yedekler") maybeAutoBackup();
    }, fail(c)));
  });
  subscribeTasks(fail("tasks"));
  subscribeThreads();
  unsubs.push(col("ayarlar").doc("genel").onSnapshot(d => { if (d.exists) AYAR = {...AYAR, ...d.data()}; refresh(); }, () => {}));
}
function subscribeTasks(onErr){
  const sid = member && member.staffId;
  const qs = gmM() ? [col("tasks").where("talep", ">=", Date.now() - 45*864e5)]
    : [member && member.dept ? col("tasks").where("dept", "==", member.dept) : null, sid ? col("tasks").where("atanan", "==", sid) : null, sid ? col("tasks").where("olusturan", "==", sid) : null].filter(Boolean);
  const parts = qs.map(() => new Map());
  qs.forEach((q, i) => unsubs.push(q.onSnapshot(snap => {
    onTaskChanges(snap, i);
    parts[i] = new Map(snap.docs.map(d => [d.id, {id:d.id, ...d.data()}]));
    const all = new Map(); parts.forEach(m => m.forEach((v,k) => all.set(k, v)));
    S.tasks = [...all.values()];
    refresh(); scheduleAlarms();
  }, onErr)));
}

}

function domainOf(){ return trLower(String(AYAR.girisDomain || domainFromHotel((AYAR.otel||{}).ad||"") || "otel.com").replace(/^@/,"").trim()) || "otel.com"; }
function suggestUser(st){
  const parts = slugUser(st.ad).split(".").filter(Boolean);
  const base = (parts.length > 1 ? parts[0] + "." + parts[parts.length-1] : (parts[0] || "personel"));
  let u = base + "@" + domainOf(), i = 2;
  while (S.staff.some(x => x.id !== st.id && x.kullanici === u)) u = base + (i++) + "@" + domainOf();
  return u;

async function giveAccess(st, pw, kullanici){
  kullanici = trLower(kullanici).replace(/\s+/g,"");
  if (!/^[a-z0-9._-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(kullanici)) throw {code:"bad-user"};
  const other = await col("logins").doc(kullanici).get({source:"server"}).catch(()=>null);
  if (other && other.exists && other.data().staffId !== st.id) throw {code:"user-taken"};
  const email = "u" + uid8() + "@" + EMAIL_DOMAIN;
  const sa = await secondaryAuth();
  const cred = await sa.createUserWithEmailAndPassword(email, pw);
  const uid = cred.user.uid; await sa.signOut();
  await col("members").doc(uid).set({otel:OTEL, staffId:st.id, rol:st.rol||"personel", dept:st.dept});
  if (st.uid && st.uid !== uid){ try { await col("members").doc(st.uid).delete(); } catch(e){} }
  await col("staff").doc(st.id).update({uid, authEmail:email, durum:"aktif", kullanici});
  await col("staffTel").doc(st.id).set({tel: st.tel || "", sifre: pw}, {merge:true});
  if (st.kullanici && st.kullanici !== kullanici){ try { await col("logins").doc(st.kullanici).delete(); } catch(e){} }
  await col("logins").doc(kullanici).set({email, staffId:st.id, otel:OTEL});
  if (telOk(st.tel||"")) await col("logins").doc(st.tel).set({email, staffId:st.id, otel:OTEL});
  for (const k of [st.tel, kullanici, st.kullanici]) if (k) { try { await col("sifreTalepleri").doc(k).delete(); } catch(e){} }
  logOp("şifre verdi", "staff", st.id, st);
}

async function deactivate(st, quiet){
  try {
    if (st.uid) await col("members").doc(st.uid).delete();
    if (st.tel) await col("logins").doc(st.tel).delete();
    if (st.kullanici) await col("logins").doc(st.kullanici).delete().catch(()=>{});
    await col("staff").doc(st.id).update({durum:"pasif"});
    logOp("girişini kapattı", "staff", st.id, st);
    if (!quiet) toast(`${st.ad} artık giriş yapamaz.`);
  } catch(e){ handleErr(e); }
}
async function approveApp(b){
  try {
    const ex = S.staff.find(s => s.tel === b.tel);
    const sid = ex ? ex.id : "p" + uid8();
    const {tel:_t, ...base} = ex ? clean(ex) : {ad:b.ad, dept:b.dept, unvan:b.unvan||"", rol:"personel"};

    await col("staffTel").doc(sid).set({tel:b.tel});

    await col("members").doc(b.uid).set({otel:OTEL, staffId:sid, rol:base.rol||"personel", dept: ex ? ex.dept : b.dept});

    await col("basvurular").doc(b.id).delete();

}

let taskTab = null, taskLv = "", taskDept = "";
function taskCard(t){
  const lv = level(t), [ll, lc] = LV[lv];
  const canManage = managesDept(t.dept);
  const sameDept = t.dept === myDept();
  const acts = [];
  if (t.durum === "open" && (t.atanan === meId || (!t.atanan && (sameDept || canManage)))) acts.push(`<button class="btn ok sm" data-act="start" data-id="${esc(t.id)}">Başlat</button>`);
  if (t.durum !== "done" && (t.atanan === meId || canManage || (sameDept && !t.atanan))) acts.push(`<button class="btn pri sm" data-act="done" data-id="${esc(t.id)}">Bitir</button>`);
  if (t.durum !== "done" && (canManage || sameDept)) acts.push(`<button class="btn sm" data-act="assign" data-id="${esc(t.id)}">Ata</button>`);
  if (mode !== "demo" && (t.atanan === meId || sameDept || canManage || t.olusturan === meId)) acts.push(`<button class="btn sm" data-act="ek" data-id="${esc(t.id)}">+ Fotoğraf</button>`);
  if (canManage) acts.push(`<span style="flex:1"></span><button class="btn sm danger" data-act="del" data-id="${esc(t.id)}">Sil</button>`);
  return `<article class="card task lv-${lv}">
    <div class="t1"><div><div class="ttl">${esc(t.ad)}</div><div class="meta"><span>${esc(t.konum||"")}</span><span>#${esc(t.no||"")}</span></div></div><span class="chip ${lc}">${ll}</span></div>
    <div class="meta"><span>Departman: <b>${esc(t.dept)}</b></span><span>Atanan: <b>${t.atanan?esc(nameOf(t.atanan)):'<span class="late">Atanmadı</span>'}</b></span></div>
    <div class="meta"><span>${t.durum==="started"?"Başladı":"Açık"} · ${fmtDT(t.talep)} · süre ${dur(t.dk)}</span><span>${timeText(t)}</span><span>Gönderen: ${esc(nameOf(t.olusturan))}</span></div>
    ${t.aciklama?`<div style="font-size:13px">${esc(t.aciklama)}</div>`:""}
    ${(t.ekler||[]).length?`<div class="acts">${t.ekler.map(x=>`<button class="btn sm" data-ek="${esc(x.id)}">${x.tur&&x.tur.startsWith("video")?"🎬 Video":"🖼 Fotoğraf"}</button>`).join("")}</div>`:""}
    ${acts.length?`<div class="acts">${acts.join("")}</div>`:""}
  </article>`;
}
function bindTaskActions(){
  document.querySelectorAll("[data-ek]").forEach(b => b.onclick = () => openAttachment(b.dataset.ek));
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const t = S.tasks.find(x => x.id === b.dataset.id); if (!t) return;
    const a = b.dataset.act;
    if (a === "start") store.upd("tasks", t.id, {durum:"started", baslama:Date.now(), atanan: t.atanan || meId || ""});
    if (a === "done") finishTask(t);
    if (a === "assign") assignSheet(t);
    if (a === "ek") addAttachSheet(t);
    if (a === "del") confirmSheet("Bu görev silinsin mi?", () => store.del("tasks", t.id), "Sil");
  });
}
async function finishTask(t){
  await store.upd("tasks", t.id, {durum:"done", bitis:Date.now(), atanan: t.atanan || meId || ""});
  const r = roomFromText(t.oda || t.konum);
  if (r && r.durum === "kirli" && /temizli/i.test(t.ad)){ await store.upd("rooms", r.id, {durum:"bos"}); toast(`Oda ${r.no} temiz olarak işaretlendi.`); }
  else if (r && r.durum === "ariza" && t.tur === "ariza"){ await store.upd("rooms", r.id, {durum: r.misafir ? "dolu" : "bos"}); }
  else toast("Görev tamamlandı.");
}
function assignSheet(t){
  const list = activeStaff(t.dept);
  sheet(`Ata: ${esc(t.ad)}`, `<div class="hint">${esc(t.dept)} departmanından birini seç.</div>
    <div class="list">${list.length ? list.map(s=>`<button class="btn block" style="text-align:left;display:flex;justify-content:space-between" data-to="${esc(s.id)}"><span>${esc(s.ad)}</span><span class="muted">${esc(ROLLER[s.rol]||"")} · ${openTasks().filter(x=>x.atanan===s.id).length} açık</span></button>`).join("") : `<div class="empty">Bu departmanda aktif personel yok.</div>`}
    ${t.atanan?`<button class="btn block" data-to="">Atamayı kaldır (departmana geri gönder)</button>`:""}</div>`, () => {
    document.querySelectorAll("#sh [data-to]").forEach(b => b.onclick = async () => { await store.upd("tasks", t.id, {atanan:b.dataset.to}); closeSheet(); toast(b.dataset.to ? `${nameOf(b.dataset.to)} kişisine atandı.` : "Departmana geri gönderildi."); });
  });
}

function guessDeptFromText(t){
  const l = " " + trLower(t) + " ";

  for (const [d, ks] of map) if (ks.some(k => l.includes(k))) return d;
  return null;
}

const canDeleteStaff = s => !!s && s.id !== meId && managesDept(s.dept) && (isGM() || isHR() || !["gm","mudur"].includes(s.rol));
function staffSheet(id){
  const s = id ? staffById(id) : null;

    <div class="row2"><div class="fld"><label for="eD">Departman</label><select id="eD" ${high?"":"disabled"}>${deptOptions(deptSel)}</select></div><div class="fld"><label for="eR">Rütbe</label><select id="eR">${rolOptions(s?s.rol:"personel", high)}</select></div></div>
    ${canEditThis?`<button class="btn go block">${s?"Kaydet":"Ekle"}</button>`:`<div class="hint">Bu kişiyi sadece genel müdür ya da İK düzenleyebilir.</div>`}</form>
    ${s && s.uid && s.durum!=="pasif" ? `<div class="card" style="background:var(--info-soft)"><div>Kullanıcı adı: <b>${esc(s.kullanici||"—")}</b></div><div>Şifre: <b class="num">${esc(s.sifre||"bilinmiyor (eski hesap) · şifreyi değiştir")}</b></div>${s.sifre?`<button type="button" class="btn sm" id="eSms" style="align-self:flex-start">Bilgileri SMS ile tekrar gönder</button>`:""}</div>` : ""}
    ${s && canEditThis && mode!=="demo" ? `<div class="list">
      ${s.durum==="pasif" ? `<button class="btn ok block" id="eAct">Tekrar aktif et (yeni şifre ver)</button>`
        : s.uid ? `<button class="btn block" id="eRst">Şifreyi değiştir</button><button class="btn danger block" id="eOff">İşten ayrıldı · girişini kapat</button>`

      const data = {ad:$("#eA").value.trim(), tel, unvan:$("#eU").value.trim(), dept:$("#eD").value, rol:$("#eR").value};
      if (s){

        toast("Kaydedildi.");

let roomSel = null, staffSel = null;
function bulkBar(count, label, onDel, onAll, onCancel){
  document.querySelectorAll(".bulkbar").forEach(n=>n.remove());
  const d = document.createElement("div"); d.className = "bulkbar";
  d.innerHTML = `<div class="in"><b>${count} ${esc(label)} seçildi</b><button class="btn sm" id="bkAll">Tümünü seç</button><button class="btn sm" id="bkNo">Vazgeç</button><button class="btn sm danger" id="bkDel" ${count?"":"disabled"}>Sil</button></div>`;
  document.body.appendChild(d);
  $("#bkAll").onclick = onAll; $("#bkNo").onclick = onCancel; $("#bkDel").onclick = onDel;
}

function roomFromText(t){ const m = /(\d{3,5})/.exec(String(t||"")); return m ? S.rooms.find(r=>r.no===m[1]) : null; }
const guestById = id => S.guests.find(g=>g.id===id);
const floorOf = r => r.kat || String(r.no).slice(0,-2) || "-";
function doluDatalist(){ return `<datalist id="doluOdalar">${S.rooms.filter(r=>r.durum==="dolu").map(r=>`<option value="${esc(r.no)}">${esc((guestById(r.misafir)||{}).ad||"")}</option>`).join("")}</datalist>`; }
function autoGuest(roomSel, nameSel){
  const f = () => { const r = S.rooms.find(x=>x.no===$(roomSel).value.trim()); const g = r && guestById(r.misafir); if (g && !$(nameSel).value) $(nameSel).value = g.ad; };
  $(roomSel).addEventListener("change", f); $(roomSel).addEventListener("input", f);
}

  },

      + (list.length ? floors.map(f => `<h2>${esc(f)}. kat</h2><div class="rgrid">${list.filter(r=>floorOf(r)===f).map(r=>{ const g=guestById(r.misafir); return `<button class="room rs-${esc(r.durum)}${roomSel&&roomSel.has(r.id)?" sel":""}" data-room="${esc(r.id)}"><b class="num">${esc(r.no)}</b><small>${g?esc(g.ad.split(" ")[0]):ROOM[r.durum][0]}</small></button>`; }).join("")}</div>`).join("") : `<div class="empty">Bu durumda oda yok.</div>`);

    $("#main").classList.toggle("selmode", !!roomSel);
    if (roomSel) bulkBar(roomSel.size, "oda", () => {
      const ids = [...roomSel], busy = ids.filter(id => (S.rooms.find(r=>r.id===id)||{}).durum === "dolu").length;

  }

function roomSheet(id){
  const r = S.rooms.find(x=>x.id===id); if (!r) return;
  const g = guestById(r.misafir);
  const open = S.tasks.filter(t => t.durum!=="done" && (t.oda===r.no || roomFromText(t.konum)===r));
  sheet(`Oda ${esc(r.no)} <span class="chip ${ROOM[r.durum][1]}">${ROOM[r.durum][0]}</span>`, `
    <div class="muted">${esc(r.tip||"Oda")} · ${esc(floorOf(r))}. kat</div>
    ${g?`<div class="card"><b>${esc(g.ad)}</b><span class="muted num">${esc(trD(g.giris))} – ${esc(trD(g.cikis))} · ${esc(g.kisi)} kişi${g.tel?" · "+esc(g.tel):""}</span><button class="btn" id="rsOut">Çıkış yap</button></div>`:""}
    ${open.length?`<div class="muted">${open.length} açık görev: ${open.map(t=>esc(t.ad)).join(", ")}</div>`:""}
    <div class="fld"><label>Durumu değiştir</label><div class="seg">${Object.entries(ROOM).map(([k,[l]])=>`<button type="button" class="${k===r.durum?"on":""}" data-rs="${k}">${l}</button>`).join("")}</div></div>
    <div class="row2">${r.durum!=="dolu"?`<button class="btn ok" id="rsGuest">Misafir yerleştir</button>`:`<span></span>`}<button class="btn go" id="rsTask">Görev gönder</button></div>
    ${isManager()?`<button class="btn danger block" id="rsDel">Odayı sil</button>`:""}`, () => {
    document.querySelectorAll("[data-rs]").forEach(b => b.onclick = () => { const k=b.dataset.rs;
      if (k==="dolu" && !g){ guestSheet(r.no); return; }
      store.upd("rooms", r.id, k==="bos"?{durum:k, misafir:""}:{durum:k}); closeSheet(); });
    if ($("#rsOut")) $("#rsOut").onclick = () => { closeSheet(); checkout(g); };
    if ($("#rsGuest")) $("#rsGuest").onclick = () => guestSheet(r.no);
    $("#rsTask").onclick = () => { prefill = {konum:"Oda "+r.no}; go("yeni"); };
    if ($("#rsDel")) $("#rsDel").onclick = () => confirmSheet(`Oda ${r.no} silinsin mi?`, ()=>store.del("rooms", r.id), "Sil");
  });
}
function genRoomsSheet(){
  sheet("Odaları otomatik oluştur", `<div class="hint">Örnek: 1101 ile başla, 3 kat, katta 20 oda → 1101–1120, 1201–1220, 1301–1320.</div>
    <div class="row2"><div class="fld"><label for="gS">İlk oda no</label><input id="gS" type="number" value="1101" inputmode="numeric"></div><div class="fld"><label for="gK">Kat sayısı</label><input id="gK" type="number" value="3" min="1" max="30" inputmode="numeric"></div></div>
    <div class="row2"><div class="fld"><label for="gN">Kattaki oda sayısı</label><input id="gN" type="number" value="20" min="1" max="99" inputmode="numeric"></div><div class="fld"><label for="gT">Oda tipi</label><input id="gT" value="Standart"></div></div>
    <div class="muted" id="gPrev"></div><button class="btn go block" id="gGo">Odaları oluştur</button>`, () => {
    const calc = () => { const st=+$("#gS").value||1101, k=Math.min(30,+$("#gK").value||1), n=Math.min(99,+$("#gN").value||1); const out=[]; for(let f=0;f<k;f++) for(let i=0;i<n;i++) out.push(String(st+f*100+i)); return out; };
    const upd = () => { const l=calc(); $("#gPrev").textContent = `${l.length} oda: ${l[0]} … ${l[l.length-1]}`; };
    ["#gS","#gK","#gN"].forEach(q=>$(q).addEventListener("input", upd)); upd();
    $("#gGo").onclick = async () => { const b=$("#gGo"); b.disabled=true; const l=calc().filter(no=>!S.rooms.some(r=>r.no===no)); const tip=$("#gT").value.trim();
      for (let i=0;i<l.length;i++){ b.textContent=`Oluşturuluyor ${i+1}/${l.length}…`; await store.set("rooms","r"+l[i],{no:l[i], kat:l[i].slice(0,-2), tip, durum:"bos", misafir:""}); }
      closeSheet(); toast(`${l.length} oda oluşturuldu.`); };
  });
}

function guestSheet(roomNo){
  const today = dayKey(Date.now()), tom = dayKey(Date.now()+864e5);
  const free = S.rooms.filter(r=>r.durum==="bos").sort((a,b)=>(+a.no)-(+b.no));
  sheet("Yeni misafir", `<form class="f" id="mf">
    <div class="fld"><label for="mA">Ad soyad *</label><input id="mA" required autocomplete="off"></div>
    <div class="row2"><div class="fld"><label for="mO">Oda *</label>${S.rooms.length?`<select id="mO" required><option value="">Seç…</option>${(roomNo&&!free.some(r=>r.no===roomNo)?[S.rooms.find(r=>r.no===roomNo)].filter(Boolean):[]).concat(free).map(r=>`<option value="${esc(r.no)}" ${r.no===roomNo?"selected":""}>${esc(r.no)}${r.tip?" · "+esc(r.tip):""}</option>`).join("")}</select>`:`<input id="mO" required inputmode="numeric">`}</div>
      <div class="fld"><label for="mK">Kişi</label><input id="mK" type="number" min="1" value="2"></div></div>
    <div class="row2"><div class="fld"><label for="mG">Giriş</label><input id="mG" type="date" value="${today}"></div><div class="fld"><label for="mC">Çıkış</label><input id="mC" type="date" value="${tom}"></div></div>
    <div class="row2"><div class="fld"><label for="mT">Telefon</label><input id="mT" type="tel"></div><div class="fld"><label for="mD">Dil</label><select id="mD">${["Türkçe","İngilizce","Almanca","Rusça","Arapça","Diğer"].map(d=>`<option>${d}</option>`).join("")}</select></div></div>
    <div class="fld"><label for="mN">Not</label><input id="mN" placeholder="Alerji, doğum günü, VIP…"></div>
    ${S.rooms.length&&!free.length?'<div class="banner">Boş oda yok. Önce bir odayı boş olarak işaretle.</div>':""}
    <button class="btn go block" type="submit">Misafiri kaydet</button></form>`, () => {
    $("#mf").onsubmit = async e => { e.preventDefault();
      const oda=$("#mO").value.trim(), giris=$("#mG").value||today, cikis=$("#mC").value||tom;
      if (cikis < giris){ toast("Çıkış tarihi girişten önce olamaz."); return; }
      const durum = giris <= today ? "konakliyor" : "beklenen";
      const id = "m"+uid8();
      await store.set("guests", id, {ad:$("#mA").value.trim(), oda, giris, cikis, kisi:+$("#mK").value||1, tel:$("#mT").value.trim(), dil:$("#mD").value, not:$("#mN").value.trim(), durum, olusturma:Date.now(), ekleyen:meId||""});
      const r = S.rooms.find(x=>x.no===oda);
      if (r && durum==="konakliyor") await store.upd("rooms", r.id, {durum:"dolu", misafir:id});
      closeSheet(); toast(durum==="konakliyor" ? `Misafir Oda ${oda}'e yerleşti.` : "Misafir beklenenlere eklendi.");
    };
  });
}
async function checkin(g){
  const r = S.rooms.find(x=>x.no===g.oda);
  if (r && r.durum==="dolu" && r.misafir!==g.id){ toast(`Oda ${g.oda} dolu görünüyor.`); return; }
  await store.upd("guests", g.id, {durum:"konakliyor", giris:dayKey(Date.now())});
  if (r) await store.upd("rooms", r.id, {durum:"dolu", misafir:g.id});
  toast(`${g.ad} giriş yaptı.`);
}
async function checkout(g){
  if (!g) return;
  await store.upd("guests", g.id, {durum:"cikti", cikisZaman:Date.now(), cikis:dayKey(Date.now())});
  const r = S.rooms.find(x=>x.no===g.oda);
  if (r) await store.upd("rooms", r.id, {durum:"kirli", misafir:""});
  const no = S.tasks.reduce((m,t)=>Math.max(m, +t.no||0), 1000) + 1;
  await store.add("tasks", {no, ad:"Oda temizliği (çıkış)", tur:"rutin", konum:"Oda "+g.oda, oda:g.oda, aciklama:`${g.ad} çıkış yaptı. Oda yeni misafir için hazırlanacak.`, atanan:"", dept:"Kat Hizmetleri", dk:30, talep:Date.now(), olusturan:meId||"", durum:"open"});
  toast(`Çıkış tamam. Oda ${g.oda} için Kat Hizmetleri'ne temizlik görevi gitti.`);
}

let chatSeen = 0; try { chatSeen = +localStorage.getItem("hp_chat_seen") || 0; } catch(e){}

const unreadChat = () => S.chat.filter(m => m.kim !== meId && m.zaman > chatSeen).length;
function onChatChanges(snap){
  if (firstChat){ firstChat = false; return; }
  snap.docChanges().forEach(ch => {
    if (ch.type !== "added" || (ch.doc.metadata && ch.doc.metadata.hasPendingWrites)) return;
    const m = ch.doc.data(); if (!m || m.kim === meId) return;
    if (current === "konusma" && curTid === "genel" && !document.hidden){ beep(); markChatSeen(); return; }
    notifyNow("Sohbet · " + nameOf(m.kim), String(m.metin||"").slice(0,120));
  });
}

const MAX_VIDEO_MB = 12, PARCA = 700000;
let pendingFiles = [];
function attachPicker(){
  return `<div class="fld"><label>Fotoğraf / video</label>
    <div class="seg"><button type="button" id="apPhoto">📷 Fotoğraf çek</button><button type="button" id="apGal">🖼 Galeriden</button></div>
    <input type="file" id="inPhoto" accept="image/*" capture="environment" hidden><input type="file" id="inGal" accept="image/*" multiple hidden>
    <div id="apList" class="acts"></div></div>`;
}
function renderPending(){
  const el = $("#apList"); if (!el) return;
  el.innerHTML = pendingFiles.map((f,i) => `<span class="chip info">${f.type.startsWith("video")?"🎬":"🖼"} ${esc(f.name.slice(0,18))} <button type="button" data-rm="${i}" style="border:0;background:none;color:inherit;cursor:pointer;font-weight:700" aria-label="Kaldır">✕</button></span>`).join("");
  el.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { pendingFiles.splice(+b.dataset.rm, 1); renderPending(); });
}
function bindAttachPicker(){
  pendingFiles = [];
  const add = files => { for (const f of files){ if (!(f.type||"").startsWith("image")){ toast("Sadece fotoğraf eklenebilir."); continue; } if (pendingFiles.length >= 6){ toast("En fazla 6 ek."); break; } pendingFiles.push(f); } renderPending(); };
  [["apPhoto","inPhoto"],["apGal","inGal"]].forEach(([b,i]) => { $("#"+b).onclick = () => $("#"+i).click(); $("#"+i).onchange = e => { add([...e.target.files]); e.target.value = ""; }; });
}
function readDataUrl(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
async function compressImage(file){
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth*sc); cv.height = Math.round(img.naturalHeight*sc);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
    return {dataUrl: cv.toDataURL("image/jpeg", 0.75), type:"image/jpeg"};
  } catch(e){ return {dataUrl: await readDataUrl(file), type:file.type||"image/jpeg"}; }
}
async function uploadFile(file, bag){
  if (!DB) throw new Error("demo");
  const isImg = (file.type||"").startsWith("image");
  const {dataUrl, type} = isImg ? await compressImage(file) : {dataUrl: await readDataUrl(file), type: file.type||"video/mp4"};
  const b64 = dataUrl.slice(dataUrl.indexOf(",")+1);
  const id = "f" + uid8(), n = Math.ceil(b64.length / PARCA);
  for (let i=0; i<n; i++) await col("dosyalar").doc(id).collection("parca").doc(String(i).padStart(3,"0")).set({i, d:b64.slice(i*PARCA, (i+1)*PARCA)});
  await col("dosyalar").doc(id).set({ad:file.name||"dosya", tur:type, boyut:Math.round(b64.length*0.75), parca:n, zaman:Date.now(), kim:meId||"", bag});
  return {id, tur:type, ad:file.name||""};
}
async function uploadPending(bag, onProgress){
  const out = [];
  for (let i=0; i<pendingFiles.length; i++){ onProgress && onProgress(`${i+1}/${pendingFiles.length}`); out.push(await uploadFile(pendingFiles[i], bag)); }
  pendingFiles = []; return out;
}
const fileCache = {};
async function loadFile(id){
  if (fileCache[id]) return fileCache[id];
  const meta = await col("dosyalar").doc(id).get(); if (!meta.exists) throw new Error("yok");
  const parts = await col("dosyalar").doc(id).collection("parca").get();
  const b64 = parts.docs.map(d => d.data()).sort((a,b)=>a.i-b.i).map(x=>x.d).join("");
  const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  const m = meta.data(); const url = URL.createObjectURL(new Blob([arr], {type:m.tur}));
  return fileCache[id] = {url, tur:m.tur, ad:m.ad};
}
async function openAttachment(id){
  sheet("Ek", `<div id="ekBox" class="empty">Yükleniyor…</div>`);
  try { const f = await loadFile(id); const box = $("#ekBox"); if (!box) return;
    box.className = ""; box.innerHTML = f.tur.startsWith("audio") ? `<audio src="${f.url}" controls style="width:100%"></audio>` : f.tur.startsWith("video") ? `<video src="${f.url}" controls playsinline style="width:100%;border-radius:10px;max-height:70vh"></video>` : `<img src="${f.url}" alt="Ek fotoğraf" style="width:100%;border-radius:10px">`;
  } catch(e){ const box = $("#ekBox"); if (box) box.textContent = "Ek açılamadı. Fotoğraflar 45 gün sonra otomatik silinir."; }
}
function addAttachSheet(t){
  sheet(`Ek ekle: ${esc(t.ad)}`, `<form class="f" id="aeF">${attachPicker()}<button class="btn go block" id="aeGo">Ekle</button></form>`, () => {

      try { const ek = await uploadPending("task:" + t.id, n => b.textContent = `Yükleniyor ${n}…`); await store.upd("tasks", t.id, {ekler:(t.ekler||[]).concat(ek)}); closeSheet(); toast("Eklendi."); }
      catch(er){ b.disabled = false; b.textContent = "Ekle"; toast("Yüklenemedi, tekrar dene."); } };
  });
}

const slotTime = saat => { const [h,m] = String(saat).split(":").map(Number); const d = new Date(); d.setHours(h||0, m||0, 0, 0); return d.getTime(); };
const dvId = (tpl, saat) => `${tpl.id}_${dayKey(Date.now())}_${String(saat).replace(":","")}`;
const visibleDv = () => S.devriyeler.filter(t => t.aktif !== false && (isGM() || t.dept === myDept() || managesDept(t.dept)));
function dvStatus(tpl, saat){
  const r = S.devriyeKayit.find(x => x.id === dvId(tpl, saat)), st = slotTime(saat), tol = (tpl.tolerans||30)*60000, now = Date.now();
  if (r && r.bitis) return [r.durum === "eksik" ? "Eksik bitti" : "Tamamlandı", r.durum === "eksik" ? "warn" : "ok", r];
  if (r && r.basla) return ["Devam ediyor", "info", r];
  if (now < st) return ["Bekliyor", "mute", r];
  if (now <= st + tol) return ["Zamanı geldi", "warn", r];
  return ["Yapılmadı", "bad", r];
}
const missedDv = () => { const out = []; visibleDv().forEach(t => (t.saatler||[]).forEach(s => { if (dvStatus(t, s)[0] === "Yapılmadı") out.push({t, s}); })); return out; };

const MAX_SES_SN = 60;
async function recordVoice(onDone){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){ toast("Bu cihaz sesli mesajı desteklemiyor."); return; }
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); } catch(e){ toast("Mikrofon izni verilmedi. Telefon ayarlarından HotelPlus'a mikrofon izni ver."); return; }
  const mime = ["audio/webm;codecs=opus","audio/mp4","audio/webm","audio/ogg"].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m));
  let rec; try { rec = new MediaRecorder(stream, mime ? {mimeType:mime, audioBitsPerSecond:24000} : {audioBitsPerSecond:24000}); } catch(e){ rec = new MediaRecorder(stream); }
  const chunks = []; let sec = 0, cancelled = false, timer = null;
  rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => { clearInterval(timer); stream.getTracks().forEach(t => t.stop()); closeSheet(); if (cancelled || !chunks.length) return; const type = (rec.mimeType || mime || "audio/webm").split(";")[0]; const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm"; onDone(new File(chunks, "ses." + ext, {type}), Math.max(1, sec)); };
  rec.start(500);
  sheet("Sesli mesaj", `<div style="text-align:center;font:700 32px var(--display)" class="num" id="vT">0:00</div><div class="hint" style="text-align:center">Kaydediliyor · en fazla 1 dakika</div><div class="row2"><button class="btn danger" id="vX">İptal</button><button class="btn go" id="vS">Gönder</button></div>`, () => {
    $("#vX").onclick = () => { cancelled = true; rec.state !== "inactive" && rec.stop(); };
    $("#vS").onclick = () => { rec.state !== "inactive" && rec.stop(); };
  }, {locked:true});
  timer = setInterval(() => { sec++; const el = $("#vT"); if (el) el.textContent = `${Math.floor(sec/60)}:${pad(sec%60)}`; if (sec >= MAX_SES_SN && rec.state !== "inactive") rec.stop(); }, 1000);
}

  const parts = slugUser(ad).split(".").filter(Boolean);
  const base = parts.length > 1 ? parts[0] + "." + parts[parts.length-1] : (parts[0] || "personel");

async function readListFile(f){

  if (/\.xlsx?$/.test(name) || /spreadsheet|excel/.test(f.type||"")){
    const X = await xlsxLib();
    const wb = X.read(new Uint8Array(await f.arrayBuffer()), {type:"array"});
    const out = [];

}

async function runBulk(rows, dom, hotel){
  if (mode === "demo"){ toast("Örnek modda hesap açılamaz."); return; }
  if (!staffRoom(rows.filter(r => !r.ex).length)) return;
  const b = $("#baGo"); b.disabled = true;
  if (dom !== AYAR.girisDomain || (hotel && hotel !== (AYAR.otel||{}).ad)) await saveAyar({girisDomain:dom, otel:{...(AYAR.otel||{}), ad: hotel || (AYAR.otel||{}).ad || ""}});
  const done = [], failed = [];
  for (let i = 0; i < rows.length; i++){
    const r = rows[i]; b.textContent = `Oluşturuluyor ${i+1}/${rows.length}: ${r.ad}`;
    try {
      let st = r.ex;
      if (!st){
        const id = "p" + uid8();
        const ok = await store.set("staff", id, {ad:r.ad, tel:r.tel, unvan:r.unvan||"", dept:r.dept, rol:r.rol, durum:"aktif"});
        if (!ok) throw {code:"staff"};
        st = {id, ad:r.ad, tel:r.tel, dept:r.dept, rol:r.rol};
      }
      await giveAccess({...st, tel: r.tel || st.tel || ""}, r.sifre, r.kullanici);
      done.push(r);
    } catch(e){ failed.push({r, e}); if (/too-many-requests/.test((e && e.code) || "")){ rows.slice(i+1).forEach(x => failed.push({r:x, e:{code:"later"}})); break; } }
  }
  bulkResult(done, failed);
}
function bulkResult(done, failed){
  const lines = done.map(r => `${r.ad}\t${r.dept}\t${r.kullanici}\t${r.sifre}${r.tel?"\t"+fmtTel(r.tel):""}`);
  const text = "Ad Soyad\tDepartman\tKullanıcı adı\tŞifre\tTelefon\n" + lines.join("\n");
  const listText = done.map(r => `${r.ad}\nKullanıcı adı: ${r.kullanici}\nŞifre: ${r.sifre}`).join("\n\n");
  sheet(`${done.length} hesap hazır`, `${failed.length ? `<div class="banner" style="background:var(--bad-soft)">${failed.length} kişiye açılamadı${failed.some(f=>f.e.code==="later"||/too-many/.test(f.e.code||""))?" (çok hızlı hesap açıldı; Google bir süre bekletiyor, 1 saat sonra aynı listeyi tekrar ver)":""}: ${failed.map(f=>esc(f.r.ad)).join(", ")}</div>` : ""}

    $("#brCopy").onclick = () => copyText(text);
    $("#brShare").onclick = () => shareText(listText);
    document.querySelectorAll("[data-cp]").forEach(b => b.onclick = () => { const r = done.find(x => x.kullanici === b.dataset.cp); copyText(credMsg(r, r.kullanici, r.sifre)); });

  });

const LEGACY_COLLS = ["ayarlar","staff","staffTel","tasks","reservations","gmsgs","chat","shifts","assets","energy","loyalty","rooms","guests","guestTel","sifreTalepleri","islemler","duyurular","sikayetler","kayipesya","devriyeler","devriyeKayit","yedekler","dosyalar","sohbetler"];
const LEGACY_SUB = {yedekler:"parca", dosyalar:"parca", sohbetler:"mesajlar"};
async function migrateLegacy(){
  closeSheet();
  $("#top").innerHTML = `<div class="mark">${icon("star","#d9a426")}</div><h1>${esc(APP_ADI)}</h1>`;
  $("#main").innerHTML = `<div class="login list"><div class="card"><b style="font:600 17px var(--display)">Yeni lisans sistemine geçiliyor</b><div>Mevcut verilerin otelinin altına taşınıyor. Bu bir kez yapılır, birkaç dakika sürebilir. Uygulamayı kapatma.</div><div id="mgP" class="muted num">Başlıyor…</div></div></div>`;
  const P = t => { const el = $("#mgP"); if (el) el.textContent = t; };
  try {
    let ay = {}; try { const a = await FS.collection("ayarlar").doc("genel").get(); ay = a.exists ? a.data() : {}; } catch(e){}
    const ad = (ay.otel && ay.otel.ad) || "Crowne Plaza Florya";
    const dom = ay.girisDomain || domainFromHotel(ad);
    const id = slugUser(ad).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "otel-1";
    await FS.collection("oteller").doc(id).set({ad, domain:dom, lisansTur:"suresiz", bitis: SURESIZ, durum:"aktif", olusturma:Date.now(), kurulum:true}, {merge:true});
    const H = c => FS.collection("oteller").doc(id).collection(c);
    let total = 0;
    const keys = new Set();
    for (const c of LEGACY_COLLS){
      let snap; try { snap = await FS.collection(c).get(); } catch(e){ continue; }
      for (const d of snap.docs){
        const data = d.data();
        if (c === "staff"){ if (data.kullanici) keys.add(data.kullanici); if (data.tel) keys.add(data.tel); }
        if (c === "staffTel" && data.tel) keys.add(data.tel);
        await H(c).doc(d.id).set(data); total++;
        if (LEGACY_SUB[c]){ const sub = await FS.collection(c).doc(d.id).collection(LEGACY_SUB[c]).get(); for (const x of sub.docs){ await H(c).doc(d.id).collection(LEGACY_SUB[c]).doc(x.id).set(x.data()); total++; } }
        if (total % 10 === 0) P(`${total} kayıt taşındı (${c})…`);
      }
    }
    P("Hesaplar otele bağlanıyor…");
    const ms = await FS.collection("members").get();
    for (const m of ms.docs) if (m.id === authUser.uid) await FS.collection("members").doc(m.id).delete(); else if (!m.data().otel) await FS.collection("members").doc(m.id).update({otel:id});
    for (const k of keys){ try { const l = await FS.collection("logins").doc(k).get(); if (l.exists && !l.data().otel) await FS.collection("logins").doc(k).set({otel:id}, {merge:true}); } catch(e){} }
    await FS.collection("oteller").doc(id).update({kurulum:false});
    P(`Tamamlandı: ${total} kayıt taşındı. Uygulama yeniden açılıyor…`);
    setTimeout(() => location.reload(), 1500);
  } catch(e){ P("Taşıma sırasında hata oldu: " + ((e && (e.code || e.message)) || "") + ". İnterneti kontrol edip uygulamayı yeniden aç; kaldığı yerden tekrar dener."); }
}

const YEDEK_KOLL = ["staff","staffTel","tasks","rooms","guests","guestTel","reservations","gmsgs","assets","energy","loyalty","shifts","chat","duyurular","ayarlar"];
const OTO_YEDEK_SAKLA = 30;
let backupBusy = false;
async function collectAll(){
  const out = {};
  for (const c of YEDEK_KOLL){ const snap = await col(c).get(); out[c] = snap.docs.map(d => ({id:d.id, ...d.data()})); }
  return out;
}
async function createBackup(tur){
  if (backupBusy || !DB) return null; backupBusy = true;
  try {
    const data = await collectAll();
    const id = "y" + Date.now();
    const sayilar = {}; Object.entries(data).forEach(([c, l]) => sayilar[c] = l.length);
    const parts = [];
    for (const [c, list] of Object.entries(data)){
      let cur = [], size = 0;
      for (const d of list){ const j = JSON.stringify(d); if (size + j.length > 600000 && cur.length){ parts.push({c, json:"[" + cur.join(",") + "]"}); cur = []; size = 0; } cur.push(j); size += j.length + 1; }
      if (cur.length) parts.push({c, json:"[" + cur.join(",") + "]"});
    }
    for (let i=0; i<parts.length; i++) await col("yedekler").doc(id).collection("parca").doc(String(i).padStart(4,"0")).set(parts[i]);
    await col("yedekler").doc(id).set({zaman:Date.now(), tur, kim:meId||"", kimAd: me() ? me().ad : "Genel Müdür", sayilar, parca:parts.length});
    return id;
  } finally { backupBusy = false; }
}
async function readBackup(b){
  const snap = await col("yedekler").doc(b.id).collection("parca").get();
  const out = {}; snap.docs.sort((a,c)=>a.id.localeCompare(c.id)).forEach(d => { const p = d.data(); out[p.c] = (out[p.c]||[]).concat(JSON.parse(p.json)); });
  return out;
}
async function deleteBackup(b){
  const snap = await col("yedekler").doc(b.id).collection("parca").get();
  for (const d of snap.docs) await d.ref.delete();
  await col("yedekler").doc(b.id).delete();
}
async function maybeAutoBackup(){
  if (backupChecked || !gmM() || mode === "demo") return; backupChecked = true;
  const last = S.yedekler.filter(b => b.tur === "otomatik")[0];
  if (!last || Date.now() - last.zaman > 23*3600e3){
    try { await createBackup("otomatik"); } catch(e){}
    const old = S.yedekler.filter(b => b.tur === "otomatik").slice(OTO_YEDEK_SAKLA);
    for (const b of old){ try { await deleteBackup(b); } catch(e){} }
  }
  cleanupFiles();
  try { const cut = Date.now() - 90*864e5; const o = await col("islemler").where("zaman","<",cut).limit(200).get(); for (const d of o.docs) await d.ref.delete(); } catch(e){}
}
function fileName(ts){ const d = new Date(ts); return `HotelPlus-yedek-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`; }
async function shareFile(name, text){
  if (isNative() && FSys && ShareP){
    const w = await FSys.writeFile({path:name, data:text, directory:"CACHE", encoding:"utf8"});
    await ShareP.share({title:name, text:"HotelPlus yedeği", files:[w.uri], dialogTitle:"Yedeği gönder"});
    return;
  }
  const file = new File([text], name, {type:"application/json"});
  if (navigator.canShare && navigator.canShare({files:[file]})){ try { await navigator.share({files:[file], title:name}); return; } catch(e){ if (e && e.name === "AbortError") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

let pdfReady = null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("yuklenemedi")); document.head.appendChild(s); }); }
function pdfLib(){
  if (!pdfReady) pdfReady = (async () => {
    const base = "vendor/";
    await loadScript(base+"pdf.worker.min.js"); await loadScript(base+"pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = base+"pdf.worker.min.js";
    return window.pdfjsLib;
  })().catch(e => { pdfReady = null; throw e; });
  return pdfReady;
}
async function readPdf(file){
  const lib = await pdfLib();
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let text = "";
  for (let i=1; i<=doc.numPages; i++){
    const c = await (await doc.getPage(i)).getTextContent();
    let lastY = null;
    let lastEnd = null;
    for (const it of c.items){
      if (!it.str && !it.hasEOL) continue;
      const y = it.transform ? Math.round(it.transform[5]) : null, x = it.transform ? it.transform[4] : null, fs = it.transform ? Math.abs(it.transform[0]) || 10 : 10;
      if (lastY !== null && y !== null && Math.abs(y - lastY) > 2){ text += "\n"; lastEnd = null; }
      if (!it.str.trim()){ if (it.str.length && text && !text.endsWith("\n")){ const w = it.width || 0; if (w > fs * 1.2){ text = text.replace(/ +$/, "") + "  "; } else if (!text.endsWith(" ")) text += " "; } lastY = y; lastEnd = (x !== null && it.width != null) ? x + it.width : lastEnd; continue; }
      else if (lastEnd !== null && x !== null && text && !text.endsWith("\n")){ const gap = x - lastEnd; if (gap > fs * 1.2) text += "  "; else if (gap > fs * 0.15 && !text.endsWith(" ") && !it.str.startsWith(" ")) text += " "; }
      text += it.str; lastY = y; lastEnd = (x !== null && it.width != null) ? x + it.width : null;
    }
    text += "\n";
  }
  return text.replace(/[ \t]{3,}/g,"  ").trim();
}
function guessDept(line){
  const l = " " + trLower(line) + " ";
  for (const d of DEPARTMANLAR_GET()) if (l.includes(" " + trLower(d) + " ") || l.includes(trLower(d))) if (d !== "Diğer") return d;
  for (const [d, keys] of Object.entries(DEPT_ANAHTAR)) if (keys.some(k=>l.includes(k))) return d;
  return "Diğer";
}
function guessRol(line){
  const l = " " + trLower(line) + " ";
  if (/yardımcı|yardimci|assistant/.test(l)) return "mudur";
  for (const r of ["gm","mudur","sef"]) if (ROL_ANAHTAR[r].some(k=>l.includes(k))) return r;
  return "personel";
}
const TEL_RE = /(?:\+?90[\s-]?)?0?\s?\(?5\d{2}\)?[\s.-]?\d{3}[\s.-]?\d{2}[\s.-]?\d{2}/;
function parseStaff(text){
  return text.split(/\n+/).map(x=>x.trim()).filter(x=>x.length>2 && /[a-zA-ZçğıöşüÇĞİÖŞÜ]/.test(x)).filter(x=>!/liste|list\b|sayfa|page|tarih|toplam|ad soyad|adı soyadı|sıra|telefon\s*$/i.test(x)).map(line => {
    const tm = TEL_RE.exec(line); const tel = tm ? normTel(tm[0]) : "";
    const rest = (tm ? line.replace(tm[0], " ") : line).replace(/^\s*\d+[.)-]?\s*/, "");
    const parts = rest.split(/\t|;|,|\s[-–|]\s|\s{2,}/).map(x=>x.trim()).filter(Boolean);
    const ad = (parts[0]||"").replace(/\s+/g," ");
    const unvan = parts.slice(1).filter(p => !DEPARTMANLAR_GET().some(d=>trLower(d)===trLower(p))).join(", ");
    const fromList = DEPARTMANLAR_GET().find(d => d !== "Diğer" && parts.slice(1).some(p => trLower(p) === trLower(d)));
    const dGuess = fromList || (unvan && guessDept(unvan) !== "Diğer" ? guessDept(unvan) : guessDept(line));
    return {ad, unvan, tel: telOk(tel)?tel:"", dept: dGuess, deptKaynak: fromList ? "liste" : (dGuess !== "Diğer" ? "unvan" : ""), rol: guessRol(unvan || line)};
  }).filter(x=>x.ad && x.ad.split(" ").length<=5 && !/^\d+$/.test(x.ad));

async function askNotifyPermission(){ if (!LN){ try { if ("Notification" in window && Notification.permission === "default") Notification.requestPermission(); } catch(e){} return; } try { const p = await LN.checkPermissions(); if (p.display !== "granted") await LN.requestPermissions(); } catch(e){} }
function nid(s){ let h = 7; for (const ch of s) h = (h*31 + ch.charCodeAt(0)) | 0; return (Math.abs(h) % 2000000000) + 1; }
let actx = null;
function unlockAudio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch(e){} }
document.addEventListener("pointerdown", unlockAudio, {passive:true});
function beep(){
  try { unlockAudio(); if (!actx) return; const t0 = actx.currentTime;
    [[0,1046],[0.16,1318]].forEach(([dt,f]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0+dt); g.gain.exponentialRampToValueAtTime(0.35, t0+dt+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0+dt+0.12); o.connect(g); g.connect(actx.destination); o.start(t0+dt); o.stop(t0+dt+0.13); });
    if (navigator.vibrate) navigator.vibrate([60,60,60]);
  } catch(e){}
}
function notifyNow(title, body){ toast(title + ": " + body); if (!LN || !document.hidden) beep(); if (!LN){ try { if ("Notification" in window && Notification.permission === "granted" && document.hidden) new Notification(title, {body, icon:"icons/icon-192.png"}); } catch(e){} return; } if (!document.hidden) return; try { LN.schedule({notifications:[{id:nid("n"+Date.now()+Math.random()), title, body, channelId:"hotelplus", sound:"dit.wav"}]}); } catch(e){} }
const notifiedKeys = new Set();
function onTaskChanges(snap, i){
  if (!firstTasks[i]){ firstTasks[i] = true; return; }
  snap.docChanges().forEach(ch => {
    if (ch.doc.metadata && ch.doc.metadata.hasPendingWrites) return;
    const t = {id:ch.doc.id, ...ch.doc.data()}; if (t.durum === "done") return;
    const key = ch.type + ":" + t.id + ":" + (t.atanan||"");
    if (notifiedKeys.has(key)) return; notifiedKeys.add(key);
    const prev = S.tasks.find(x=>x.id===t.id);
    if (ch.type === "added" && t.olusturan !== meId){
      if (t.atanan === meId) notifyNow("Sana yeni görev", `${t.ad} · ${t.konum}`);
      else if (!t.atanan && t.dept === myDept()) notifyNow(`${t.dept}: yeni görev`, `${t.ad} · ${t.konum} · ${dur(t.dk)}`);
    }
    if (ch.type === "modified" && prev && prev.atanan !== meId && t.atanan === meId) notifyNow("Görev sana atandı", `${t.ad} · ${t.konum}`);
  });
}
let alarmTimer = null;
function scheduleAlarms(){ clearTimeout(alarmTimer); alarmTimer = setTimeout(syncAlarms, 2500); }
async function syncAlarms(){
  if (!LN || mode === "login" || mode === "demo") return;
  const now = Date.now(), want = [];
  for (const t of S.tasks){
    if (t.durum === "done") continue;
    const dl = deadline(t), ra = redAt(t);
    if (t.atanan === meId && dl > now) want.push({id:nid(t.id+":me"), title:"Görevin süresi doldu", body:`${t.ad} · ${t.konum}`, at:dl});
    if (myRol() === "mudur" && managesDept(t.dept) && dl > now) want.push({id:nid(t.id+":y"), title:`Gecikme: ${t.dept}`, body:`${t.ad} · ${t.konum} süresinde bitmedi`, at:dl});
    if (isGM() && ra > now) want.push({id:nid(t.id+":r"), title:"Kritik gecikme", body:`${t.dept}: ${t.ad} · ${t.konum}`, at:ra});
  }
  want.sort((a,b)=>a.at-b.at); const top = want.slice(0, 60);
  try {
    const pend = ((await LN.getPending()).notifications || []).map(n => +n.id);
    const wantIds = new Set(top.map(w=>w.id));
    const cancel = pend.filter(id => !wantIds.has(id));
    if (cancel.length) await LN.cancel({notifications: cancel.map(id=>({id}))});
    const add = top.filter(w => !pend.includes(w.id));
    if (add.length) await LN.schedule({notifications: add.map(w => ({id:w.id, title:w.title, body:w.body, channelId:"hotelplus", sound:"dit.wav", schedule:{at:new Date(w.at), allowWhileIdle:true}}))});
  } catch(e){}
}
async function cancelAllAlarms(){ if (!LN) return; try { const p = (await LN.getPending()).notifications||[]; if (p.length) await LN.cancel({notifications:p.map(n=>({id:n.id}))}); } catch(e){} }
